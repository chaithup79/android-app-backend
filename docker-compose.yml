version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: curiq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: curiqdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curiq -d curiqdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-M02-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Note: run `docker exec -it <container> ollama run gemma3:4b` to fetch the model initially

  api:
    build: .
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=api
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/curiqdb
      - SPRING_DATASOURCE_USERNAME=curiq
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=worker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/curiqdb
      - SPRING_DATASOURCE_USERNAME=curiq
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
